<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Aishwarya MC — AI/ML Engineering Student</title>
    <meta
      name="description"
      content="Portfolio of Aishwarya MC, a B.E. Artificial Intelligence and Machine Learning student in Bangalore."
    />
    <meta name="theme-color" content="#080808" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080808;
        --bg2: #101010;
        --ink: #f5f2ea;
        --mute: #a8a39a;
        --gold: #c7a76c;
        --line: rgba(255, 255, 255, 0.12);
        --serif: "Bodoni Moda", "Playfair Display", "Didot", Georgia, serif;
        --sans:
          "Manrope", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --gold-grad: linear-gradient(
          100deg,
          #8c7142 0%,
          #ead7a8 34%,
          #c7a76c 58%,
          #f6e8c0 80%,
          #9d8050 100%
        );
        --ease: cubic-bezier(0.19, 0.86, 0.24, 1);
        --pad: clamp(20px, 5vw, 84px);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.65;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body.locked {
        overflow: hidden;
      }
      img,
      svg {
        display: block;
        max-width: 100%;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      ul {
        list-style: none;
      }
      ::selection {
        background: var(--gold);
        color: #080808;
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 4px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .wrap {
        padding-inline: var(--pad);
        max-width: 1720px;
        margin-inline: auto;
      }

      /* ---------- grain + progress ---------- */
      .grain {
        position: fixed;
        inset: -50%;
        z-index: 800;
        pointer-events: none;
        opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        animation: grain 1.2s steps(6) infinite;
      }
      @keyframes grain {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-3%, 2%);
        }
        40% {
          transform: translate(2%, -3%);
        }
        60% {
          transform: translate(-2%, -2%);
        }
        80% {
          transform: translate(3%, 3%);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      .progress {
        position: fixed;
        left: 0;
        top: 0;
        height: 2px;
        width: 100%;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: 0 50%;
        z-index: 1000;
      }

      /* ---------- loader + curtain ---------- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
      }
      #loader .ld-a,
      #loader .ld-b {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50.5%;
        background: #050505;
        transition: transform 1s var(--ease);
      }
      #loader .ld-a {
        top: 0;
      }
      #loader .ld-b {
        bottom: 0;
      }
      #loader.done .ld-a {
        transform: translateY(-101%);
      }
      #loader.done .ld-b {
        transform: translateY(101%);
      }
      #loader .ld-mid {
        position: relative;
        text-align: center;
        transition: opacity 0.4s;
      }
      #loader.done .ld-mid {
        opacity: 0;
      }
      .ld-n {
        display: block;
        font-family: var(--serif);
        font-size: clamp(72px, 16vw, 220px);
        line-height: 1;
        font-weight: 500;
        background: var(--gold-grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-variant-numeric: tabular-nums;
      }
      .ld-t {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #curtain {
        position: fixed;
        inset: 0;
        background: #0b0b0b;
        z-index: 900;
        transform: translateY(100%);
        pointer-events: none;
        display: grid;
        place-items: center;
      }
      #curtain span {
        font-family: var(--serif);
        font-size: clamp(28px, 5vw, 56px);
        color: var(--gold);
        letter-spacing: 0.04em;
      }

      /* ---------- cursor ---------- */
      .cursor {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1500;
        pointer-events: none;
        display: none;
      }
      .cursor i {
        display: grid;
        place-items: center;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 1px solid var(--gold);
        border-radius: 50%;
        font-style: normal;
        font-size: 0;
        letter-spacing: 0.14em;
        color: #080808;
        transition:
          width 0.35s var(--ease),
          height 0.35s var(--ease),
          margin 0.35s var(--ease),
          background 0.3s,
          border-color 0.3s,
          font-size 0.2s;
      }
      .cursor.is-btn i {
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        background: rgba(199, 167, 108, 0.16);
      }
      .cursor.is-view i {
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        background: var(--gold);
        font-size: 10px;
        font-weight: 700;
      }
      @media (hover: hover) and (pointer: fine) {
        html.has-cursor,
        html.has-cursor a,
        html.has-cursor button,
        html.has-cursor input,
        html.has-cursor textarea {
          cursor: none;
        }
        html.has-cursor .cursor {
          display: block;
        }
      }

      /* ---------- navigation ---------- */
      .nav {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 760;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px var(--pad);
        transition:
          background 0.5s,
          padding 0.5s var(--ease),
          border-color 0.5s;
        border-bottom: 1px solid transparent;
      }
      .nav.solid {
        background: rgba(8, 8, 8, 0.82);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        padding-block: 14px;
        border-color: var(--line);
      }
      .logo {
        font-family: var(--serif);
        font-size: 26px;
        letter-spacing: 0.02em;
        font-weight: 600;
      }
      .logo b {
        color: var(--gold);
        font-weight: 600;
      }
      .nav ul {
        display: flex;
        gap: clamp(18px, 2.6vw, 44px);
      }
      .nav ul a {
        position: relative;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        padding: 8px 0;
        color: var(--mute);
        transition: color 0.3s;
      }
      .nav ul a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 2px;
        height: 1px;
        width: 100%;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.5s var(--ease);
      }
      .nav ul a:hover,
      .nav ul a.on {
        color: var(--ink);
      }
      .nav ul a:hover::after,
      .nav ul a.on::after {
        transform: scaleX(1);
        transform-origin: left;
      }
      body.menu-open .nav {
        background: transparent;
        border-color: transparent;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .burger {
        display: none;
        width: 48px;
        height: 48px;
        background: none;
        border: 0;
        position: relative;
        z-index: 760;
      }
      .burger span {
        position: absolute;
        left: 12px;
        right: 12px;
        height: 1.5px;
        background: var(--ink);
        transition:
          transform 0.5s var(--ease),
          top 0.5s var(--ease);
      }
      .burger span:nth-child(1) {
        top: 19px;
      }
      .burger span:nth-child(2) {
        top: 28px;
      }
      .burger[aria-expanded="true"] span:nth-child(1) {
        top: 23.5px;
        transform: rotate(45deg);
      }
      .burger[aria-expanded="true"] span:nth-child(2) {
        top: 23.5px;
        transform: rotate(-45deg);
      }
      .menu {
        position: fixed;
        inset: 0;
        z-index: 750;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px var(--pad) 40px;
        clip-path: circle(0 at calc(100% - 44px) 44px);
        transition: clip-path 0.9s var(--ease);
        visibility: hidden;
      }
      .menu.open {
        clip-path: circle(150% at calc(100% - 44px) 44px);
        visibility: visible;
      }
      .menu a.m {
        display: block;
        font-family: var(--serif);
        font-size: clamp(40px, 11vw, 72px);
        line-height: 1.12;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.6s,
          transform 0.8s var(--ease);
      }
      .menu.open a.m {
        opacity: 1;
        transform: none;
        transition-delay: calc(0.25s + var(--i) * 70ms);
      }
      .menu .m-foot {
        margin-top: 36px;
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        color: var(--mute);
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      @media (max-width: 900px) {
        .nav ul {
          display: none;
        }
        .burger {
          display: block;
        }
      }

      /* ---------- reveal primitives ---------- */
      .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding-bottom: 0.12em;
        margin-bottom: -0.12em;
      }
      .wd {
        display: inline-block;
        white-space: nowrap;
      }
      .wi {
        display: inline-block;
        transform: translateY(112%) rotate(3deg);
        transform-origin: 0 100%;
        transition: transform 1.1s var(--ease);
        transition-delay: calc(var(--i, 0) * 55ms + var(--d, 0ms));
      }
      .in .wi,
      .in.wi {
        transform: none;
      }
      [data-fade] {
        opacity: 0;
        transform: translateY(34px);
        transition:
          opacity 1s var(--ease),
          transform 1.2s var(--ease);
        transition-delay: var(--d, 0ms);
      }
      [data-fade].in {
        opacity: 1;
        transform: none;
      }
      .rv {
        position: relative;
        overflow: hidden;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 1.5s var(--ease);
      }
      .rv > .rv-in {
        transform: scale(1.28);
        transition: transform 2s var(--ease);
      }
      .rv.in {
        clip-path: inset(0 0 0 0);
      }
      .rv.in > .rv-in {
        transform: scale(1);
      }
      .hero [data-fade] {
        transition-delay: calc(1.5s + var(--d, 0ms));
      }
      .hero .rv {
        transition-delay: 0.2s;
      }
      body:not(.ready) .hero .rv,
      body:not(.ready) .hero .wi,
      body:not(.ready) .hero [data-fade] {
        transition-delay: 0s;
      }

      /* ---------- typography ---------- */
      .big {
        font-family: var(--serif);
        font-weight: 500;
        text-transform: uppercase;
        font-size: clamp(54px, 11.4vw, 200px);
        line-height: 0.9;
        letter-spacing: -0.025em;
      }
      .serif {
        font-family: var(--serif);
      }
      .gold {
        background: var(--gold-grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lbl {
        font-size: 12px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .sec {
        position: relative;
        padding: clamp(90px, 14vw, 220px) 0;
      }
      .sec-head {
        margin-bottom: clamp(40px, 7vw, 110px);
      }
      .sec-head .lbl {
        display: block;
        margin-bottom: 22px;
      }

      /* ---------- buttons ---------- */
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 17px 28px;
        border: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 600;
        background: transparent;
        overflow: hidden;
        isolation: isolate;
        transition:
          color 0.5s var(--ease),
          border-color 0.5s;
        cursor: pointer;
        min-height: 48px;
      }
      .btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform: translateY(101%);
        transition: transform 0.6s var(--ease);
        z-index: -1;
      }
      .btn:hover {
        color: #080808;
        border-color: var(--gold);
      }
      .btn:hover::before {
        transform: none;
      }
      .btn .ar {
        display: inline-block;
        transition: transform 0.5s var(--ease);
      }
      .btn:hover .ar {
        transform: translateX(6px);
      }
      .btn.solid {
        background: var(--gold);
        color: #080808;
        border-color: var(--gold);
      }
      .btn.solid::before {
        background: var(--ink);
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      /* ---------- hero ---------- */
      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 var(--pad) clamp(28px, 4vw, 52px);
      }
      .hero-light {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            60% 55% at 74% 26%,
            rgba(199, 167, 108, 0.22),
            transparent 70%
          ),
          radial-gradient(
            40% 40% at 74% 8%,
            rgba(255, 236, 190, 0.16),
            transparent 70%
          );
        pointer-events: none;
      }
      .hero-photo {
        position: absolute;
        right: clamp(16px, 5vw, 90px);
        top: 0;
        bottom: 0;
        width: min(44vw, 680px);
      }
      .hero-photo .rv {
        position: absolute;
        inset: 8vh 0 14vh 0;
        -webkit-mask-image: linear-gradient(#000 62%, transparent 100%);
        mask-image: linear-gradient(#000 62%, transparent 100%);
      }
      .hero-photo .rv::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(90deg, #080808 0, rgba(8, 8, 8, 0) 34%),
          linear-gradient(180deg, #080808 0, rgba(8, 8, 8, 0) 20%);
      }
      .hero-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 18%;
        animation: drift 14s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from {
          transform: scale(1.02) translateY(0);
        }
        to {
          transform: scale(1.07) translateY(-1.2%);
        }
      }
      .hero-photo::after {
        content: "";
        position: absolute;
        left: -14px;
        top: 12vh;
        bottom: 22vh;
        width: 1px;
        background: linear-gradient(transparent, var(--gold), transparent);
        opacity: 0.6;
      }
      .hero-side {
        position: absolute;
        right: calc(clamp(16px, 5vw, 90px) - 34px);
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
        transform-origin: center;
        font-size: 11px;
        letter-spacing: 0.4em;
        color: var(--mute);
        white-space: nowrap;
        text-transform: uppercase;
      }
      .hero-copy {
        position: relative;
        z-index: 2;
      }
      .hero-name {
        font-family: var(--serif);
        font-weight: 600;
        text-transform: uppercase;
        line-height: 0.84;
        letter-spacing: -0.03em;
        font-size: clamp(56px, 9.6vw, 190px);
      }
      .hero-name .hn {
        display: block;
      }
      .hero-name .hn.mc {
        padding-left: 0.04em;
      }
      .hero-name .wi {
        background: var(--gold-grad);
        background-size: 280% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sheen 3.4s 2.2s var(--ease) 1 both;
      }
      @keyframes sheen {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }
      .hero-line {
        max-width: 34ch;
        margin-top: clamp(18px, 2.4vw, 34px);
        font-size: clamp(17px, 1.6vw, 22px);
        color: var(--ink);
        line-height: 1.5;
      }
      .hero-foot {
        position: relative;
        z-index: 2;
        margin-top: clamp(26px, 4vw, 64px);
        padding-top: 22px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }
      .hero-foot b {
        display: block;
        font-size: 12px;
        letter-spacing: 0.3em;
        font-weight: 600;
      }
      .hero-foot span {
        display: block;
        font-size: 12px;
        letter-spacing: 0.3em;
        color: var(--mute);
        margin-top: 6px;
      }
      .scroll {
        font-size: 12px;
        letter-spacing: 0.3em;
        color: var(--mute);
        display: inline-flex;
        align-items: center;
        gap: 12px;
        transition: color 0.3s;
      }
      .scroll:hover {
        color: var(--gold);
      }
      .scroll::after {
        content: "";
        width: 1px;
        height: 38px;
        background: linear-gradient(var(--gold), transparent);
        animation: drop 2s ease-in-out infinite;
        transform-origin: top;
      }
      @keyframes drop {
        0% {
          transform: scaleY(0);
        }
        50% {
          transform: scaleY(1);
        }
        100% {
          transform: scaleY(1);
          opacity: 0;
        }
      }
      @media (max-width: 900px) {
        .hero {
          justify-content: flex-start;
          padding-top: 0;
        }
        .hero-photo {
          position: relative;
          right: auto;
          width: calc(100% + 2 * var(--pad));
          margin: 0 calc(-1 * var(--pad));
          height: 64svh;
          min-height: 380px;
        }
        .hero-photo .rv {
          inset: 0;
          -webkit-mask-image: linear-gradient(#000 55%, transparent 100%);
          mask-image: linear-gradient(#000 55%, transparent 100%);
        }
        .hero-photo::after,
        .hero-side {
          display: none;
        }
        .hero-photo img {
          object-position: 50% 22%;
        }
        .hero-copy {
          margin-top: -13svh;
        }
        .hero-name {
          font-size: clamp(46px, 15.4vw, 120px);
        }
      }

      /* ---------- marquee ---------- */
      .marquee {
        border-block: 1px solid var(--line);
        overflow: hidden;
        padding: 26px 0;
        background: var(--bg2);
      }
      .mq-track {
        display: flex;
        width: max-content;
        animation: mq 42s linear infinite;
      }
      .marquee:hover .mq-track {
        animation-play-state: paused;
      }
      .mq-track span {
        font-family: var(--serif);
        font-size: clamp(28px, 4vw, 56px);
        white-space: nowrap;
        padding-right: 0.9em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .mq-track span::after {
        content: "/";
        color: var(--gold);
        padding-left: 0.9em;
      }
      @keyframes mq {
        to {
          transform: translateX(-50%);
        }
      }

      /* ---------- about ---------- */
      .about-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: clamp(30px, 7vw, 130px);
        align-items: start;
      }
      .about-bio {
        font-family: var(--serif);
        font-size: clamp(22px, 2.3vw, 34px);
        line-height: 1.42;
        font-weight: 400;
        max-width: 34em;
      }
      .facts {
        margin-top: clamp(34px, 5vw, 70px);
        border-top: 1px solid var(--line);
      }
      .facts div {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 18px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        transition:
          padding 0.5s var(--ease),
          background 0.5s;
      }
      .facts div:hover {
        padding-left: 14px;
        background: linear-gradient(
          90deg,
          rgba(199, 167, 108, 0.08),
          transparent
        );
      }
      .facts dt {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--mute);
        padding-top: 3px;
      }
      .facts dd {
        font-size: 16px;
      }
      .about-photo {
        position: relative;
      }
      .about-photo .frame {
        aspect-ratio: 4/5;
        background: #111;
        border: 1px solid var(--line);
      }
      .about-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 20%;
      }
      .about-photo::before {
        content: "";
        position: absolute;
        inset: 26px -22px -22px 26px;
        border: 1px solid rgba(199, 167, 108, 0.45);
        z-index: -1;
      }
      @media (max-width: 900px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
        .about-photo {
          order: -1;
          max-width: 520px;
        }
        .facts div {
          grid-template-columns: 110px 1fr;
        }
      }

      /* ---------- timeline (education + experience) ---------- */
      .tl {
        position: relative;
        padding-left: clamp(26px, 5vw, 80px);
      }
      .tl-line {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .tl-line i {
        position: absolute;
        inset: 0;
        background: var(--gold);
        transform-origin: top;
        transform: scaleY(var(--p, 0));
      }
      .tl-item {
        position: relative;
        display: grid;
        grid-template-columns: minmax(150px, 240px) 1fr;
        gap: clamp(20px, 4vw, 70px);
        padding: clamp(34px, 5vw, 70px) 0;
        border-bottom: 1px solid var(--line);
      }
      .tl-item:last-child {
        border-bottom: 0;
      }
      .tl-item::before {
        content: "";
        position: absolute;
        left: calc(-1 * clamp(26px, 5vw, 80px) - 5px);
        top: clamp(44px, 5.6vw, 80px);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--gold);
        transition:
          background 0.6s,
          box-shadow 0.6s;
      }
      .tl-item.in::before {
        background: var(--gold);
        box-shadow: 0 0 0 7px rgba(199, 167, 108, 0.14);
      }
      .tl-when {
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        padding-top: 8px;
      }
      .tl-item h3 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(28px, 4vw, 58px);
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .tl-item h4 {
        font-size: 15px;
        font-weight: 500;
        color: var(--mute);
        margin-top: 12px;
        letter-spacing: 0.06em;
      }
      .tl-item p {
        margin-top: 20px;
        max-width: 46em;
        color: #d8d3c8;
      }
      .tl-item .meta {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 30px;
        color: var(--ink);
        font-size: 15px;
      }
      @media (max-width: 760px) {
        .tl-item {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }

      /* ---------- skills ---------- */
      .primary {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 30px;
        margin-bottom: clamp(30px, 5vw, 70px);
      }
      .primary strong {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(34px, 6vw, 96px);
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .srows {
        border-top: 1px solid var(--line);
      }
      .srow {
        display: grid;
        grid-template-columns: minmax(200px, 0.7fr) 2fr;
        gap: 20px;
        align-items: baseline;
        padding: clamp(22px, 3vw, 40px) 0;
        border-bottom: 1px solid var(--line);
        position: relative;
        transition:
          opacity 0.5s,
          padding 0.6s var(--ease);
      }
      .srow::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 1px;
        width: 100%;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.8s var(--ease);
      }
      .srows:hover .srow {
        opacity: 0.35;
      }
      .srows .srow:hover {
        opacity: 1;
        padding-left: clamp(10px, 2vw, 30px);
      }
      .srow:hover::after {
        transform: scaleX(1);
      }
      .srow h3 {
        font-size: 12px;
        letter-spacing: 0.3em;
        color: var(--gold);
        font-weight: 600;
      }
      .srow .sk {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 0;
      }
      .srow .sk span {
        font-family: var(--serif);
        font-size: clamp(26px, 3.6vw, 54px);
        line-height: 1.18;
        letter-spacing: -0.01em;
      }
      .srow .sk span:not(:last-child)::after {
        content: "/";
        color: var(--gold);
        padding: 0 0.35em;
        opacity: 0.7;
      }
      @media (max-width: 760px) {
        .srow {
          grid-template-columns: 1fr;
          gap: 8px;
        }
      }

      /* ---------- projects ---------- */
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 4px;
        margin-bottom: clamp(30px, 4vw, 60px);
        align-items: center;
      }
      .filters button {
        background: none;
        border: 0;
        padding: 12px 16px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--mute);
        position: relative;
        min-height: 44px;
        transition: color 0.3s;
      }
      .filters button::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 8px;
        height: 1px;
        background: var(--gold);
        transform: scaleX(0);
        transition: transform 0.5s var(--ease);
      }
      .filters button:hover {
        color: var(--ink);
      }
      .filters button[aria-pressed="true"] {
        color: var(--gold);
      }
      .filters button[aria-pressed="true"]::after {
        transform: scaleX(1);
      }
      .filters .count {
        margin-left: auto;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--mute);
      }
      #gallery {
        transition:
          opacity 0.35s,
          transform 0.35s var(--ease);
      }
      #gallery.swap {
        opacity: 0;
        transform: translateY(20px);
      }
      .proj {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: clamp(26px, 6vw, 110px);
        align-items: center;
        padding: clamp(40px, 7vw, 110px) 0;
        border-top: 1px solid var(--line);
      }
      .proj:nth-child(even) {
        grid-template-columns: 1fr 1.25fr;
      }
      .proj:nth-child(even) .proj-media {
        order: 2;
      }
      .proj-media {
        position: relative;
        display: block;
        aspect-ratio: 3/2;
        background: #0d0d0d;
        border: 1px solid var(--line);
      }
      .proj-media .rv {
        position: absolute;
        inset: 0;
        border: 0;
      }
      .proj-media .rv-in {
        height: 100%;
      }
      .proj-media svg {
        width: 100%;
        height: 100%;
        transition: transform 1.4s var(--ease);
      }
      .proj-media:hover svg {
        transform: scale(1.06);
      }
      .ov {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 40%,
          rgba(8, 8, 8, 0.86)
        );
        opacity: 0;
        transition: opacity 0.6s;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 22px 24px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        z-index: 3;
      }
      .ov b {
        display: inline-block;
        font-size: 26px;
        font-weight: 400;
        transform: translate(-10px, 10px);
        transition: transform 0.6s var(--ease);
      }
      .proj-media:hover .ov {
        opacity: 1;
      }
      .proj-media:hover .ov b {
        transform: none;
      }
      .badge {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 4;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
        background: rgba(8, 8, 8, 0.7);
        padding: 5px 10px;
        border: 1px solid var(--line);
      }
      .proj-body {
        position: relative;
        transition: transform 0.8s var(--ease);
      }
      .proj:hover .proj-body {
        transform: translateX(8px);
      }
      .proj:nth-child(even):hover .proj-body {
        transform: translateX(-8px);
      }
      .pn {
        display: block;
        font-family: var(--serif);
        font-size: clamp(80px, 11vw, 190px);
        line-height: 0.8;
        color: transparent;
        -webkit-text-stroke: 1px rgba(199, 167, 108, 0.55);
        transition:
          color 0.7s,
          transform 0.8s var(--ease),
          -webkit-text-stroke-color 0.5s;
        margin-bottom: 18px;
      }
      .proj:hover .pn {
        color: rgba(199, 167, 108, 0.16);
        -webkit-text-stroke-color: var(--gold);
        transform: translateX(10px);
      }
      .proj-body h3 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(30px, 4.2vw, 64px);
        line-height: 1;
        letter-spacing: -0.015em;
        text-transform: uppercase;
      }
      .proj-body .cat {
        display: block;
        margin: 16px 0 18px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .proj-body p {
        color: #d3cec3;
        max-width: 34em;
        margin-bottom: 20px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 28px;
      }
      .tags li {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--mute);
        border: 1px solid var(--line);
        padding: 5px 12px;
        border-radius: 99px;
      }
      .proj.full {
        grid-template-columns: 1fr;
        gap: 34px;
      }
      .proj.full:nth-child(even) .proj-media {
        order: 0;
      }
      .proj.full .proj-media {
        aspect-ratio: 21/9;
      }
      .proj.full .proj-body {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: clamp(24px, 5vw, 90px);
        align-items: start;
      }
      .proj.full .pn {
        grid-row: 1/4;
      }
      .proj.full:hover .proj-body {
        transform: none;
      }
      .more {
        margin-top: 40px;
        display: flex;
        justify-content: center;
      }
      @media (max-width: 900px) {
        .proj,
        .proj:nth-child(even) {
          grid-template-columns: 1fr;
          gap: 26px;
        }
        .proj:nth-child(even) .proj-media {
          order: 0;
        }
        .proj-media,
        .proj.full .proj-media {
          aspect-ratio: 3/2;
        }
        .proj.full .proj-body {
          display: block;
        }
        .pn {
          font-size: 82px;
        }
        .proj:hover .proj-body,
        .proj:nth-child(even):hover .proj-body {
          transform: none;
        }
        .filters .count {
          width: 100%;
          margin: 6px 0 0 16px;
        }
      }

      /* ---------- journey / resume cta ---------- */
      .journey {
        position: relative;
        min-height: 90vh;
        display: grid;
        place-items: center;
        text-align: center;
        overflow: hidden;
        border-block: 1px solid var(--line);
      }
      .journey .bg {
        position: absolute;
        inset: -12% 0;
        background-size: cover;
        background-position: 50% 40%;
        opacity: 0.34;
        filter: saturate(0.8);
      }
      .journey::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          70% 60% at 50% 50%,
          rgba(8, 8, 8, 0.15),
          var(--bg) 92%
        );
        z-index: 1;
      }
      .journey .in-wrap {
        position: relative;
        z-index: 2;
        padding: 0 var(--pad);
      }
      .journey h2 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(38px, 7.4vw, 124px);
        line-height: 0.98;
        letter-spacing: -0.02em;
        max-width: 12em;
        margin-inline: auto;
      }
      .journey .btns {
        justify-content: center;
        margin-top: clamp(28px, 4vw, 54px);
      }
      .steps {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px 34px;
        margin-top: clamp(28px, 4vw, 50px);
        color: var(--mute);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .steps span {
        position: relative;
      }
      .steps span:not(:last-child)::after {
        content: "→";
        color: var(--gold);
        margin-left: 34px;
      }
      @media (max-width: 640px) {
        .steps span::after {
          display: none;
        }
        .steps {
          gap: 6px 20px;
        }
      }

      /* ---------- contact ---------- */
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(34px, 7vw, 130px);
        margin-top: clamp(36px, 6vw, 90px);
      }
      .c-intro {
        font-family: var(--serif);
        font-size: clamp(22px, 2.4vw, 36px);
        line-height: 1.35;
        max-width: 22em;
        margin-bottom: clamp(28px, 4vw, 54px);
      }
      .c-list {
        border-top: 1px solid var(--line);
      }
      .c-list a,
      .c-list div {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
        transition:
          padding 0.5s var(--ease),
          color 0.3s;
      }
      .c-list a:hover {
        padding-left: 14px;
        color: var(--gold);
      }
      .c-list small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .c-list span.v {
        font-size: clamp(16px, 1.6vw, 21px);
        word-break: break-word;
      }
      .ic {
        width: 22px;
        height: 22px;
        flex: none;
        fill: none;
        stroke: var(--gold);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ic.fill {
        fill: var(--gold);
        stroke: none;
      }
      .socials {
        display: flex;
        gap: 12px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      .socials a {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition:
          border-color 0.4s,
          color 0.4s,
          transform 0.5s var(--ease);
        min-height: 48px;
      }
      .socials a:hover {
        border-color: var(--gold);
        color: var(--gold);
        transform: translateY(-3px);
      }
      form.cf {
        display: grid;
        gap: 34px;
        align-content: start;
      }
      .fld {
        position: relative;
      }
      .fld input,
      .fld textarea {
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 26px 0 12px;
        font-size: 18px;
        outline: none;
        resize: none;
        border-radius: 0;
        transition: border-color 0.4s;
      }
      .fld label {
        position: absolute;
        left: 0;
        top: 26px;
        font-size: 16px;
        color: var(--mute);
        pointer-events: none;
        transition:
          transform 0.5s var(--ease),
          font-size 0.5s,
          color 0.4s;
        transform-origin: left;
      }
      .fld input:focus,
      .fld textarea:focus {
        border-color: var(--gold);
      }
      .fld input:focus + label,
      .fld textarea:focus + label,
      .fld input:not(:placeholder-shown) + label,
      .fld textarea:not(:placeholder-shown) + label {
        transform: translateY(-24px);
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .form-note {
        font-size: 14px;
        color: var(--mute);
        min-height: 1.6em;
      }
      .form-note.err {
        color: #e59c8b;
      }
      @media (max-width: 900px) {
        .contact-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- footer ---------- */
      footer.foot {
        border-top: 1px solid var(--line);
        padding: clamp(50px, 7vw, 100px) 0 30px;
        background: var(--bg2);
      }
      .foot-top {
        display: flex;
        justify-content: space-between;
        gap: 40px;
        flex-wrap: wrap;
      }
      .foot-name {
        font-family: var(--serif);
        font-size: clamp(40px, 7vw, 110px);
        line-height: 0.9;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .foot-meta {
        color: var(--mute);
        font-size: 13px;
        letter-spacing: 0.24em;
        margin-top: 16px;
        text-transform: uppercase;
        line-height: 2;
      }
      .foot-links {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }
      .foot-links a {
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--mute);
        padding: 6px 0;
        transition:
          color 0.3s,
          transform 0.4s var(--ease);
      }
      .foot-links a:hover {
        color: var(--gold);
        transform: translateX(6px);
      }
      .foot-bot {
        margin-top: clamp(40px, 6vw, 80px);
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--mute);
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }

      /* ---------- project detail pages ---------- */
      .pd {
        padding: clamp(120px, 13vw, 190px) 0 0;
        position: relative;
      }
      .back {
        display: inline-flex;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mute);
        padding: 10px 0;
        transition:
          color 0.3s,
          transform 0.4s var(--ease);
      }
      .back:hover {
        color: var(--gold);
        transform: translateX(-6px);
      }
      .pd-n {
        font-family: var(--serif);
        color: transparent;
        -webkit-text-stroke: 1px rgba(199, 167, 108, 0.6);
        font-size: clamp(90px, 16vw, 280px);
        line-height: 0.8;
        display: block;
      }
      .pd h1 {
        font-family: var(--serif);
        font-weight: 500;
        text-transform: uppercase;
        font-size: clamp(40px, 8.4vw, 150px);
        line-height: 0.92;
        letter-spacing: -0.025em;
      }
      .pd-cat {
        margin-top: 22px;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .pd-stack {
        position: relative;
        perspective: 1400px;
      }
      .pd-media {
        position: relative;
        aspect-ratio: 16/9;
        border: 1px solid var(--line);
        background: #0d0d0d;
        transform-style: preserve-3d;
        transition: transform 0.5s var(--ease);
      }
      .pd-media .rv {
        position: absolute;
        inset: 0;
      }
      .pd-media svg {
        width: 100%;
        height: 100%;
      }
      .pane-b,
      .pane-c {
        display: none;
      }
      .pd-body {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: clamp(30px, 7vw, 120px);
        margin-top: clamp(40px, 7vw, 100px);
      }
      .lead {
        font-family: var(--serif);
        font-size: clamp(24px, 3vw, 44px);
        line-height: 1.28;
        letter-spacing: -0.005em;
      }
      .rest {
        margin-top: 22px;
        color: #d3cec3;
        max-width: 38em;
      }
      .pd dl {
        border-top: 1px solid var(--line);
      }
      .pd dl div {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .pd dt {
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--mute);
        margin-bottom: 6px;
      }
      .pd dd {
        font-size: 16px;
      }
      .pd .btns {
        margin-top: 30px;
      }
      .pd-note {
        margin-top: 14px;
        font-size: 13px;
        color: var(--mute);
      }
      .pd-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: clamp(70px, 10vw, 150px);
        border-top: 1px solid var(--line);
      }
      .pd-nav a {
        display: block;
        padding: clamp(28px, 4vw, 60px) var(--pad);
        transition: background 0.5s;
      }
      .pd-nav a:hover {
        background: var(--bg2);
      }
      .pd-nav a + a {
        border-left: 1px solid var(--line);
        text-align: right;
      }
      .pd-nav small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--mute);
        margin-bottom: 10px;
      }
      .pd-nav strong {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(22px, 3.4vw, 50px);
        line-height: 1.05;
        text-transform: uppercase;
        display: inline-block;
        transition: transform 0.6s var(--ease);
      }
      .pd-nav a:hover strong {
        transform: translateX(10px);
      }
      .pd-nav a + a:hover strong {
        transform: translateX(-10px);
      }
      .pd-hero {
        display: block;
      }
      /* template 1: wide cinematic banner */
      .tpl-1 .pd-head {
        margin-bottom: clamp(30px, 5vw, 70px);
      }
      /* template 2: split with sticky title */
      .tpl-2 .pd-split {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: clamp(30px, 6vw, 100px);
        align-items: start;
      }
      .tpl-2 .pd-head {
        position: sticky;
        top: 110px;
      }
      .tpl-2 .pd-media {
        aspect-ratio: 4/3;
      }
      .tpl-2 .pd-body {
        grid-template-columns: 1fr;
        margin-top: clamp(30px, 4vw, 50px);
      }
      /* template 3: layered panes, echoes the reference */
      .tpl-3 .pd-head {
        margin-bottom: clamp(60px, 8vw, 110px);
      }
      .tpl-3 .pane-b,
      .tpl-3 .pane-c {
        display: block;
        position: absolute;
        inset: 0;
        border: 1px solid var(--line);
        background: #0d0d0d;
        opacity: 0.9;
      }
      .tpl-3 .pane-b {
        transform: translate3d(0, -28px, -60px) scale(0.96);
        opacity: 0.55;
      }
      .tpl-3 .pane-c {
        transform: translate3d(0, -56px, -120px) scale(0.92);
        opacity: 0.28;
      }
      .tpl-3 .pd-media {
        transform: rotateX(var(--rx, 4deg)) rotateY(var(--ry, 0deg));
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
      }
      /* template 4: poster, centered */
      .tpl-4 .pd-head {
        text-align: center;
      }
      .tpl-4 .pd-n {
        margin-bottom: 14px;
      }
      .tpl-4 .pd-media {
        max-width: 820px;
        margin-inline: auto;
        aspect-ratio: 1/1;
      }
      .tpl-4 .pd-body {
        grid-template-columns: 1fr;
        text-align: center;
        justify-items: center;
      }
      .tpl-4 .btns {
        justify-content: center;
      }
      .tpl-4 dl {
        width: min(560px, 100%);
        text-align: left;
      }
      @media (max-width: 900px) {
        .pd-body {
          grid-template-columns: 1fr;
        }
        .tpl-2 .pd-split {
          grid-template-columns: 1fr;
        }
        .tpl-2 .pd-head {
          position: static;
        }
        .pd-media,
        .tpl-2 .pd-media {
          aspect-ratio: 3/2;
        }
        .tpl-4 .pd-media {
          aspect-ratio: 1/1;
        }
        .pd-nav {
          grid-template-columns: 1fr;
        }
        .pd-nav a + a {
          border-left: 0;
          border-top: 1px solid var(--line);
          text-align: left;
        }
      }

      /* ---------- archive + resume pages ---------- */
      .arch {
        padding: clamp(120px, 13vw, 190px) 0 clamp(80px, 10vw, 160px);
      }
      .arch-list {
        margin-top: clamp(30px, 5vw, 70px);
        border-top: 1px solid var(--line);
      }
      .arch-row {
        display: grid;
        grid-template-columns: 90px 1fr 1fr 40px;
        gap: 20px;
        align-items: center;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
        position: relative;
        transition:
          padding 0.6s var(--ease),
          color 0.3s;
      }
      .arch-row:hover {
        padding-left: 20px;
        color: var(--gold);
      }
      .arch-row .n {
        font-family: var(--serif);
        font-size: 22px;
        color: var(--mute);
      }
      .arch-row .t {
        font-family: var(--serif);
        font-size: clamp(22px, 3.2vw, 46px);
        line-height: 1.05;
        text-transform: uppercase;
      }
      .arch-row .c {
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .arch-row .ar {
        transition: transform 0.5s var(--ease);
        justify-self: end;
      }
      .arch-row:hover .ar {
        transform: translateX(6px);
      }
      @media (max-width: 700px) {
        .arch-row {
          grid-template-columns: 44px 1fr 24px;
        }
        .arch-row .c {
          display: none;
        }
      }
      .rs {
        padding: clamp(120px, 13vw, 190px) 0 clamp(70px, 9vw, 140px);
      }
      .rs-head {
        margin: 20px 0 clamp(30px, 5vw, 60px);
      }
      .rs-head h1 {
        font-family: var(--serif);
        font-weight: 500;
        text-transform: uppercase;
        font-size: clamp(44px, 9vw, 140px);
        line-height: 0.92;
      }
      .rs-head p {
        color: var(--mute);
        margin-top: 12px;
      }
      .rs-sec {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: clamp(20px, 5vw, 80px);
        padding: 34px 0;
        border-top: 1px solid var(--line);
      }
      .rs-sec h2 {
        font-size: 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }
      .rs-sec h3 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(22px, 2.4vw, 32px);
        line-height: 1.15;
      }
      .rs-sec .it {
        margin-bottom: 24px;
      }
      .rs-sec .it:last-child {
        margin-bottom: 0;
      }
      .rs-sec p,
      .rs-sec li {
        color: #d3cec3;
      }
      .rs-sec .small {
        font-size: 14px;
        color: var(--mute);
        margin-top: 4px;
      }
      .rs-sec ul.cols {
        columns: 2;
        column-gap: 40px;
      }
      .rs-actions {
        margin-top: 40px;
      }
      @media (max-width: 760px) {
        .rs-sec {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .rs-sec ul.cols {
          columns: 1;
        }
      }

      /* ---------- concept-art animation ---------- */
      .pulse {
        animation: pulse 2.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.35);
          opacity: 0.55;
        }
      }
      .spin {
        animation: spin 9s linear infinite;
        transform-box: view-box;
        transform-origin: 400px 280px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .dash {
        stroke-dasharray: 10 12;
        animation: dash 2.4s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -44;
        }
      }
      .ecg {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: ecg 3.2s ease-in-out infinite;
      }
      @keyframes ecg {
        0% {
          stroke-dashoffset: 900;
        }
        60%,
        100% {
          stroke-dashoffset: 0;
        }
      }
      .bar {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: bar 3.6s var(--ease) infinite alternate;
      }
      @keyframes bar {
        from {
          transform: scaleY(0.55);
        }
        to {
          transform: scaleY(1);
        }
      }
      .float {
        animation: float 5s ease-in-out infinite alternate;
      }
      @keyframes float {
        to {
          transform: translateY(-10px);
        }
      }

      /* ---------- print (resume as PDF) ---------- */
      @media print {
        .nav,
        .menu,
        .cursor,
        .grain,
        .progress,
        #loader,
        #curtain,
        .no-print,
        .foot {
          display: none !important;
        }
        html,
        body {
          background: #fff !important;
          color: #111 !important;
        }
        .rs {
          padding: 0;
        }
        .rs-head h1,
        .rs-sec h3 {
          color: #111;
        }
        .rs-sec p,
        .rs-sec li,
        .rs-head p,
        .rs-sec .small {
          color: #333;
        }
        .rs-sec h2 {
          color: #7a5f2a;
        }
        .rs-sec,
        .rs-sec {
          border-color: #ccc;
        }
        [data-fade],
        .wi {
          opacity: 1 !important;
          transform: none !important;
        }
      }

      /* ---------- reduced motion ---------- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001s !important;
          transition-delay: 0s !important;
          scroll-behavior: auto !important;
        }
        .wi {
          transform: none;
        }
        [data-fade] {
          opacity: 1;
          transform: none;
        }
        .rv {
          clip-path: none;
        }
        .rv > .rv-in {
          transform: none;
        }
        .grain {
          display: none;
        }
      }

      /* last-page photo */
      .end-photo {
        margin-top: clamp(50px, 8vw, 120px);
        aspect-ratio: 21/9;
        border: 1px solid var(--line);
      }
      .end-photo .rv-in {
        height: 100%;
      }
      .end-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 35%;
      }
      @media (max-width: 900px) {
        .end-photo {
          aspect-ratio: 4/3;
        }
      }

      .foot-photo {
        margin-bottom: clamp(40px, 6vw, 80px);
        aspect-ratio: 21/9;
        border: 1px solid var(--line);
      }
      .foot-photo .rv-in,
      .foot-photo img {
        height: 100%;
        width: 100%;
      }
      .foot-photo img {
        object-fit: cover;
        object-position: 50% 30%;
      }
      @media (max-width: 700px) {
        .foot-photo {
          aspect-ratio: 4/3;
        }
      }
    </style>
  </head>

        function projectHTML(p) {
          const i = P.indexOf(p),
            prev = P[(i + P.length - 1) % P.length],
            next = P[(i + 1) % P.length];
          const sentences = p.desc
            .match(/[^.]+\.?/g)
            .map((s) => s.trim())
            .filter(Boolean);
          const lead = sentences[0],
            rest = sentences.slice(1).join(" ");
          const tpl = (i % 4) + 1;
          const head = `<div class="pd-head"><a class="back" href="#/projects" data-cursor="btn">← All projects</a><span class="pd-n" aria-hidden="true">${pad(p.n)}</span><h1 data-split>${esc(p.name)}</h1><p class="pd-cat" data-fade>${esc(p.cat)}</p></div>`;
          const media = `<div class="pd-stack" data-tilt><div class="pane-c"></div><div class="pane-b"></div><div class="pd-media"><div class="rv" data-reveal><div class="rv-in" style="height:100%">${art(p)}</div></div><span class="badge">Concept visual</span></div></div>`;
          const body = `<div class="pd-body"><div><p class="lead" data-fade>${esc(lead)}</p>${rest ? `<p class="rest" data-fade>${esc(rest)}</p>` : ""}</div>
  <div data-fade><dl><div><dt>Number</dt><dd>${pad(p.n)} of ${P.length}</dd></div><div><dt>Category</dt><dd>${esc(p.cat)}</dd></div><div><dt>Focus areas</dt><dd>${p.focus.map(esc).join(", ")}</dd></div></dl>
  <div class="btns"><a class="btn solid" href="${p.url}" target="_blank" rel="noopener noreferrer" data-cursor="btn">${p.repo ? "View on GitHub" : "GitHub profile"} <span class="ar" aria-hidden="true">↗</span></a></div>
  <p class="pd-note">${p.repo ? "The full technology stack is listed in the repository." : "The repository for this project is not linked yet, so this button opens my GitHub profile."}</p></div></div>`;
          const inner =
            tpl === 2
              ? `<div class="pd-split">${head}<div>${media}${body}</div></div>`
              : `${head}${media}${body}`;
          return `<main class="pd tpl-${tpl}"><div class="wrap">${inner}</div>
  <nav class="pd-nav" aria-label="More projects"><a href="#/project/${prev.slug}" data-cursor="btn"><small>Previous · ${pad(prev.n)}</small><strong>${esc(prev.name)}</strong></a><a href="#/project/${next.slug}" data-cursor="btn"><small>Next · ${pad(next.n)}</small><strong>${esc(next.name)}</strong></a></nav></main>${footerHTML()}`;
        }

        function archiveHTML() {
          return `<main class="arch"><div class="wrap"><a class="back" href="#/projects" data-cursor="btn">← Back to gallery</a>
  <h1 class="big" data-split>Project<br>index</h1>
  <div class="arch-list">${P.map((p) => `<a class="arch-row" href="#/project/${p.slug}" data-cursor="btn" data-fade><span class="n">${pad(p.n)}</span><span class="t">${esc(p.name)}</span><span class="c">${esc(p.cat)}</span><span class="ar" aria-hidden="true">→</span></a>`).join("")}</div></div></main>${footerHTML()}`;
        }

        function resumeHTML() {
          return `<main class="rs"><div class="wrap">
  <a class="back no-print" href="#/journey" data-cursor="btn">← Back</a>
  <div class="rs-head"><h1 data-split>Aishwarya MC</h1><p>${ME.title} · ${ME.location}</p><p>${ME.email} · ${ME.phone}</p><p>${ME.github} · ${ME.linkedin}</p></div>
  <section class="rs-sec" data-fade><h2>Profile</h2><p>${esc(ME.bio)}</p></section>
  <section class="rs-sec" data-fade><h2>Education</h2><div class="it"><h3>${ME.degree}</h3><p>Aditya College of Engineering and Technology, Bangalore</p><p class="small">CGPA ${ME.cgpa}</p></div></section>
  <section class="rs-sec" data-fade><h2>Experience</h2><div>${EXPERIENCE.map((e) => `<div class="it"><h3>${e.role} — ${e.org}</h3><p class="small">${e.when}</p><p>${esc(e.text)}</p></div>`).join("")}</div></section>
  <section class="rs-sec" data-fade><h2>Skills</h2><div>${SKILL_GROUPS.map(([g, s]) => `<div class="it"><h3>${g}</h3><p>${s.join(", ")}</p></div>`).join("")}</div></section>
  <section class="rs-sec" data-fade><h2>Projects</h2><ul class="cols">${P.map((p) => `<li>${esc(p.name)}</li>`).join("")}</ul></section>
  <div class="rs-actions no-print btns"><button class="btn solid" type="button" id="printBtn" data-cursor="btn">Download resume <span class="ar" aria-hidden="true">↓</span></button><a class="btn" href="#/projects" data-cursor="btn">See projects <span class="ar" aria-hidden="true">→</span></a></div>
  <p class="pd-note no-print">Download opens your browser's print dialog. Choose "Save as PDF".</p>
  </div></main>${footerHTML()}`;
        }

        /* =========================================================
   ENGINE: split text, reveal, parallax, tilt, cursor
   ========================================================= */
        function splitEl(el) {
          if (el.dataset.done) return;
          el.dataset.done = 1;
          const chars = el.dataset.split === "chars";
          let i = 0,
            out = "";
          const label = el.textContent.replace(/\s+/g, " ").trim();
          el.childNodes.forEach((n) => {
            if (n.nodeType === 3) {
              n.textContent.split(/(\s+)/).forEach((t) => {
                if (!t) return;
                if (!t.trim()) {
                  out += " ";
                  return;
                }
                const inner = chars
                  ? [...t]
                      .map(
                        (c) =>
                          `<span class="w" aria-hidden="true"><span class="wi" style="--i:${i++}">${c}</span></span>`,
                      )
                      .join("")
                  : `<span class="w" aria-hidden="true"><span class="wi" style="--i:${i++}">${t}</span></span>`;
                out += chars ? `<span class="wd">${inner}</span>` : inner;
              });
            } else out += n.outerHTML || "";
          });
          el.innerHTML = out;
          el.setAttribute("aria-label", label);
        }
        let io = null;
        function setupReveal(root) {
          $$("[data-split]", root).forEach(splitEl);
          const els = $$(
            "[data-split],[data-fade],[data-reveal],.tl-item",
            root,
          ).filter((e) => !e.hasAttribute("data-hero"));
          if (!("IntersectionObserver" in window)) {
            els.forEach((e) => e.classList.add("in"));
            return;
          }
          io && io.disconnect();
          const proxy =
            new Map(); /* clipped elements are watched through their parent */
          io = new IntersectionObserver(
            (es) =>
              es.forEach((e) => {
                if (e.isIntersecting) {
                  (proxy.get(e.target) || [e.target]).forEach((t) =>
                    t.classList.add("in"),
                  );
                  io.unobserve(e.target);
                }
              }),
            { threshold: 0.12, rootMargin: "0px 0px -6% 0px" },
          );
          els.forEach((e) => {
            if (e.classList.contains("rv")) {
              const p = e.parentElement;
              proxy.set(p, [...(proxy.get(p) || []), e]);
              io.observe(p);
            } else io.observe(e);
          });
          if (document.body.classList.contains("ready"))
            $$("[data-hero]", root).forEach((e) => e.classList.add("in"));
        }
        const heroIn = () =>
          $$("[data-hero]").forEach((e) => e.classList.add("in"));

        const isSmall = () => innerWidth < 900;
        let ticking = false;
        function onScroll() {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(frameUpdate);
          }
        }
        function frameUpdate() {
          ticking = false;
          const y = scrollY,
            h = document.documentElement.scrollHeight - innerHeight;
          $(".progress").style.transform = `scaleX(${h > 0 ? y / h : 0})`;
          $(".nav").classList.toggle("solid", y > 40);
          if (!reduce && !isSmall())
            $$("[data-par]").forEach((el) => {
              const r = el.getBoundingClientRect();
              if (r.bottom < -200 || r.top > innerHeight + 200) return;
              const k = parseFloat(el.dataset.par),
                d = (r.top + r.height / 2 - innerHeight / 2) * k;
              el.style.transform = `translate3d(0,${d.toFixed(1)}px,0)`;
            });
          $$("[data-tl]").forEach((t) => {
            const r = t.getBoundingClientRect();
            t.style.setProperty(
              "--p",
              clamp((innerHeight * 0.65 - r.top) / r.height, 0, 1).toFixed(3),
            );
          });
        }
        addEventListener("scroll", onScroll, { passive: true });
        addEventListener("resize", onScroll);

        /* nav active section */
        let secIO = null;
        function watchSections() {
          secIO && secIO.disconnect();
          const links = $$(".nav ul a");
          const mark = (id) =>
            links.forEach((a) =>
              a.classList.toggle("on", a.dataset.sec === id),
            );
          if (!$("#home")) {
            mark("");
            return;
          }
          secIO = new IntersectionObserver(
            (es) =>
              es.forEach((e) => {
                if (e.isIntersecting) mark(e.target.dataset.sec);
              }),
            { rootMargin: "-45% 0px -50% 0px" },
          );
          $$("[data-sec]").forEach((s) => secIO.observe(s));
        }

        /* tilt for project stack */
        document.addEventListener("mousemove", (e) => {
          const t = e.target.closest && e.target.closest("[data-tilt]");
          if (!t || reduce) return;
          const m = $(".pd-media", t),
            r = t.getBoundingClientRect();
          m.style.setProperty(
            "--ry",
            (((e.clientX - r.left) / r.width - 0.5) * 8).toFixed(2) + "deg",
          );
          m.style.setProperty(
            "--rx",
            (4 - ((e.clientY - r.top) / r.height - 0.5) * 8).toFixed(2) + "deg",
          );
        });

        /* custom cursor + magnetic buttons */
        (function cursor() {
          if (!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
          document.documentElement.classList.add("has-cursor");
          const c = $("#cursor"),
            lab = $("i", c);
          let x = innerWidth / 2,
            y = innerHeight / 2,
            tx = x,
            ty = y;
          addEventListener("mousemove", (e) => {
            tx = e.clientX;
            ty = e.clientY;
          });
          (function loop() {
            x += (tx - x) * 0.2;
            y += (ty - y) * 0.2;
            c.style.transform = `translate3d(${x}px,${y}px,0)`;
            requestAnimationFrame(loop);
          })();
          document.addEventListener("mouseover", (e) => {
            const t = e.target.closest("[data-cursor],a,button,input,textarea");
            c.classList.remove("is-btn", "is-view");
            lab.textContent = "";
            if (!t) return;
            if (t.dataset.cursor === "view") {
              c.classList.add("is-view");
              lab.textContent = "VIEW";
            } else c.classList.add("is-btn");
          });
          document.addEventListener("mousemove", (e) => {
            const b = e.target.closest(".btn");
            if (!b || reduce) return;
            const r = b.getBoundingClientRect();
            b.style.transform = `translate(${((e.clientX - r.left) / r.width - 0.5) * 8}px,${((e.clientY - r.top) / r.height - 0.5) * 6}px)`;
          });
          document.addEventListener("mouseout", (e) => {
            const b = e.target.closest && e.target.closest(".btn");
            if (b) b.style.transform = "";
          });
        })();

        /* =========================================================
   INTERACTIONS
   ========================================================= */
        let filter = "all";
        function renderGallery(animate) {
          const g = $("#gallery");
          if (!g) return;
          const list = P.filter(
            (p) => filter === "all" || p.tags.includes(filter),
          );
          const draw = () => {
            g.innerHTML = list.map(projectRow).join("");
            $("#count").textContent =
              `${pad(list.length)} / ${pad(P.length)} projects`;
            setupReveal(g);
            $$("#gallery [data-reveal]").forEach((e) => {
              const r = e.getBoundingClientRect();
              if (r.top < innerHeight) e.classList.add("in");
            });
          };
          if (animate && !reduce) {
            g.classList.add("swap");
            setTimeout(() => {
              draw();
              g.classList.remove("swap");
            }, 320);
          } else draw();
        }
        function bindHome() {
          $$("[data-filter]").forEach((b) =>
            b.addEventListener("click", () => {
              filter = b.dataset.filter;
              $$("[data-filter]").forEach((x) =>
                x.setAttribute("aria-pressed", x === b),
              );
              renderGallery(true);
            }),
          );
          renderGallery(false);
          const cf = $("#cf");
          cf &&
            cf.addEventListener("submit", (e) => {
              e.preventDefault();
              const n = $("#form-note"),
                d = new FormData(cf);
              const name = d.get("name").trim(),
                email = d.get("email").trim(),
                msg = d.get("message").trim();
              n.classList.remove("err");
              if (!name || !/^\S+@\S+\.\S+$/.test(email) || !msg) {
                n.classList.add("err");
                n.textContent =
                  "Please add your name, a valid email address, and a message.";
                return;
              }
              const subject = encodeURIComponent(
                  `Portfolio message from ${name}`,
                ),
                body = encodeURIComponent(`${msg}\n\n— ${name} (${email})`);
              n.textContent = `Opening your email app with the message ready to send. If nothing opens, write to ${ME.email}.`;
              location.href = `mailto:${ME.email}?subject=${subject}&body=${body}`;
            });
          const dl = $("[data-dl]");
          dl &&
            dl.addEventListener("click", (e) => {
              if (RESUME_FILE) {
                e.preventDefault();
                window.open(RESUME_FILE, "_blank", "noopener");
              } else autoPrint = true;
            });
        }
        let autoPrint = false;
        function bindResume() {
          const b = $("#printBtn");
          b &&
            b.addEventListener("click", () => {
              try {
                window.print();
              } catch (_) {}
            });
          if (RESUME_FILE && b)
            b.addEventListener("click", () =>
              window.open(RESUME_FILE, "_blank", "noopener"),
            );
          if (autoPrint) {
            autoPrint = false;
            setTimeout(() => {
              try {
                window.print();
              } catch (_) {}
            }, 900);
          }
        }

        /* =========================================================
   ROUTER + TRANSITIONS
   ========================================================= */
        const app = $("#app"),
          curtain = $("#curtain");
        let currentView = null,
          busy = Promise.resolve();
        const SECTIONS = [
          "home",
          "about",
          "education",
          "skills",
          "experience",
          "projects",
          "journey",
          "contact",
        ];
        function parse() {
          const h = location.hash.replace(/^#\/?/, "").split("?")[0],
            [a, b] = h.split("/");
          if (!a || SECTIONS.includes(a))
            return { view: "home", sec: a || "home" };
          if (a === "project" && bySlug[b])
            return { view: "project/" + b, slug: b };
          if (a === "archive") return { view: "archive" };
          if (a === "resume") return { view: "resume" };
          return { view: "home", sec: "home" };
        }
        function scrollToSec(id, smooth) {
          const el = id === "home" ? null : document.getElementById(id);
          const top = el
            ? el.getBoundingClientRect().top +
              scrollY -
              (id === "journey" ? 0 : 0)
            : 0;
          scrollTo({ top, behavior: smooth && !reduce ? "smooth" : "auto" });
        }
        function mount(r) {
          if (r.view === "home") {
            app.innerHTML = homeHTML();
            bindHome();
          } else if (r.view === "archive") app.innerHTML = archiveHTML();
          else if (r.view === "resume") {
            app.innerHTML = resumeHTML();
            bindResume();
          } else app.innerHTML = projectHTML(bySlug[r.slug]);
          document.title = r.view.startsWith("project/")
            ? `${bySlug[r.slug].name} — Aishwarya MC`
            : r.view === "resume"
              ? "Resume — Aishwarya MC"
              : r.view === "archive"
                ? "Project index — Aishwarya MC"
                : "Aishwarya MC — AI/ML Engineering Student";
          setupReveal(app);
          watchSections();
          requestAnimationFrame(frameUpdate);
        }
        async function navigate() {
          const r = parse();
          if (currentView === r.view && r.view === "home") {
            scrollToSec(r.sec, true);
            return;
          }
          if (currentView === r.view) return;
          const first = currentView === null;
          currentView = r.view;
          if (!first && !reduce) {
            curtain.querySelector("span").textContent = r.view.startsWith(
              "project/",
            )
              ? bySlug[r.slug].name
              : r.view === "home"
                ? "Aishwarya MC"
                : r.view === "resume"
                  ? "Resume"
                  : "Index";
            curtain.style.transition = "transform .6s cubic-bezier(.7,0,.2,1)";
            curtain.style.transform = "translateY(0)";
            await sleep(640);
          }
          mount(r);
          if (r.view === "home")
            (scrollTo({ top: 0, behavior: "auto" }),
              r.sec !== "home" &&
                requestAnimationFrame(() => scrollToSec(r.sec, false)));
          else scrollTo({ top: 0, behavior: "auto" });
          if (!first && !reduce) {
            await sleep(120);
            curtain.style.transform = "translateY(-100%)";
            await sleep(650);
            curtain.style.transition = "none";
            curtain.style.transform = "translateY(100%)";
          }
          if (document.body.classList.contains("ready")) heroIn();
          closeMenu();
        }
        const go = () => {
          busy = busy.then(navigate).catch((err) => console.error(err));
        };
        addEventListener("hashchange", go);
        document.addEventListener("click", (e) => {
          const a = e.target.closest('a[href^="#/"]');
          if (!a) return;
          closeMenu();
          if (a.getAttribute("href") === location.hash) {
            e.preventDefault();
            go();
          }
        });
        history.scrollRestoration = "manual";

        /* menu */
        const burger = $("#burger"),
          menu = $("#menu");
        function closeMenu() {
          burger.setAttribute("aria-expanded", "false");
          menu.classList.remove("open");
          document.body.classList.remove("locked", "menu-open");
          menu.setAttribute("aria-hidden", "true");
        }
        burger.addEventListener("click", () => {
          const o = burger.getAttribute("aria-expanded") !== "true";
          burger.setAttribute("aria-expanded", o);
          menu.classList.toggle("open", o);
          document.body.classList.toggle("locked", o);
          document.body.classList.toggle("menu-open", o);
          menu.setAttribute("aria-hidden", String(!o));
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeMenu();
        });

        /* loader */
        function runLoader() {
          const L = $("#loader"),
            n = $(".ld-n");
          document.body.classList.add("locked");
          const finish = () => {
            if (L.classList.contains("done")) return;
            L.classList.add("done");
            document.body.classList.remove("locked");
            document.body.classList.add("ready");
            heroIn();
            setTimeout(() => L.remove(), 1200);
          };
          if (reduce) {
            n.textContent = "100";
            finish();
            return;
          }
          const t0 = performance.now(),
            dur = 1500;
          (function step(t) {
            const p = clamp((t - t0) / dur, 0, 1),
              e = 1 - Math.pow(1 - p, 3);
            n.textContent = Math.round(e * 100);
            if (p < 1) requestAnimationFrame(step);
            else setTimeout(finish, 250);
          })(t0);
          setTimeout(finish, 4000);
        }

        /* boot */
        $("#menu-links").innerHTML = [
          ["Home", "home"],
          ["About", "about"],
          ["Projects", "projects"],
          ["Experience", "experience"],
          ["Skills", "skills"],
          ["Contact", "contact"],
          ["Resume", "resume"],
          ["Project index", "archive"],
        ]
          .map(
            ([l, h], i) =>
              `<a class="m" style="--i:${i}" href="#/${h}">${l}</a>`,
          )
          .join("");
        $("#menu-social").innerHTML =
          `<a href="${ME.github}" target="_blank" rel="noopener noreferrer">GitHub</a><a href="${ME.linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="${ME.instagram}" target="_blank" rel="noopener noreferrer">Instagram</a>`;
        go();
        runLoader();
      })();
    </script>
  </body>
</html>
